[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mrks-job-protocol"
version = "1.0.0"
description = "Python models and client for MRKS Durable Job Protocol 1.0"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrks_job_protocol"]
