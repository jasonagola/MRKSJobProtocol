name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt -e python
      - run: npm run generate
      - run: npm test
      - run: python -m pytest python/tests
      - run: git diff --exit-code
  npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, registry-url: 'https://registry.npmjs.org'}
      # npm trusted publishing requires npm CLI 11.5.1 or newer so the
      # GitHub Actions OIDC identity can be exchanged without a registry token.
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run generate
      - run: npm publish --provenance --access public
        working-directory: typescript
  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install build
      - run: python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
